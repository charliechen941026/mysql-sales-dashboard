<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background: #f3f6fb;
    color: #243047;
}

header {
    background: #1e3a8a;
    color: white;
    padding: 28px 20px;
    text-align: center;
}

header h1 {
    margin: 0 0 10px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 24px 16px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
}

.card, .chart {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.card h3 {
    font-size: 15px;
    color: #64748b;
    margin: 0 0 12px;
}

.card p {
    font-size: 25px;
    font-weight: bold;
    margin: 0;
    overflow-wrap: anywhere;
}

.charts {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
}

.chart {
    min-width: 0;
    overflow: hidden;
}

.chart .plotly-graph-div {
    width: 100% !important;
}

@media (max-width: 768px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }
    .card p {
        font-size: 21px;
    }
    header h1 {
        font-size: 24px;
    }
}

@media (max-width: 400px) {
    .stats {
        grid-template-columns: 1fr;
    }
}
</style>
